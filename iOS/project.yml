name: Atlas
options:
  bundleIdPrefix: com.atlas
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  ClerkSDK:
    url: https://github.com/clerk/clerk-ios
    from: "1.2.3"
  KeychainSwift:
    url: https://github.com/evgenyneu/keychain-swift
    from: "20.0.0"

targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - Atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharyjcollins.atlas
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: "K28M38H7Y5"
        INFOPLIST_FILE: Atlas/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Atlas/Resources/Atlas.entitlements
        ALWAYS_SEARCH_USER_PATHS: NO
    dependencies:
      - package: ClerkSDK
        product: ClerkKit
      - package: KeychainSwift
        product: KeychainSwift
      - target: SkywatchWidget

  SkywatchWidget:
    type: app-extension
    platform: iOS
    sources:
      - SkywatchWidget
      - path: Atlas/Shared/FlightActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharyjcollins.atlas.SkywatchWidget
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: "K28M38H7Y5"
        INFOPLIST_FILE: SkywatchWidget/Info.plist
        ALWAYS_SEARCH_USER_PATHS: NO

  AtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AtlasTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharyjcollins.atlas.tests
    dependencies:
      - target: Atlas
