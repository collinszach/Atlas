<!doctype html><meta charset="utf-8"><title>Atlas app icon concepts</title>
<style>
 body{background:#1a1d24;margin:0;padding:40px;display:flex;gap:40px;flex-wrap:wrap;font-family:system-ui}
 .cell{display:flex;flex-direction:column;align-items:center;gap:12px}
 .ic{width:200px;height:200px;border-radius:46px;overflow:hidden;box-shadow:0 16px 40px -12px rgba(0,0,0,.7)}
 .lbl{color:#9fb0cc;font-size:14px;font-weight:600}
 svg{display:block}
</style>
<body>

<!-- 1: Tracked jet + dashed trail -->
<div class="cell">
 <div class="ic"><svg width="200" height="200" viewBox="0 0 100 100">
  <defs>
   <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a36"/><stop offset="1" stop-color="#06101f"/></linearGradient>
   <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F8DFF"/><stop offset="1" stop-color="#26E0E0"/></linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg1)"/>
  <g stroke="#26E0E0" stroke-width="3.4" stroke-linecap="round" opacity=".8">
   <line x1="22" y1="76" x2="24" y2="74"/><line x1="32" y1="68" x2="35" y2="65"/><line x1="43" y1="58" x2="46" y2="55"/>
  </g>
  <!-- swept jet pointing up-right -->
  <g transform="translate(62,40) rotate(45) scale(.42)">
   <path fill="url(#g1)" d="M50 4 L56 18 L56 40 L95 64 L95 72 L56 56 L56 80 L70 90 L70 95 L50 88 L30 95 L30 90 L44 80 L44 56 L5 72 L5 64 L44 40 L44 18 Z"/>
  </g>
 </svg></div>
 <div class="lbl">1 · Tracked jet</div>
</div>

<!-- 2: Radar -->
<div class="cell">
 <div class="ic"><svg width="200" height="200" viewBox="0 0 100 100">
  <defs>
   <radialGradient id="bg2" cx=".35" cy=".3"><stop offset="0" stop-color="#0e1d3c"/><stop offset="1" stop-color="#060d1a"/></radialGradient>
   <linearGradient id="sw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26E0E0" stop-opacity=".55"/><stop offset="1" stop-color="#26E0E0" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg2)"/>
  <g fill="none" stroke="#4F8DFF" stroke-width="1.6" opacity=".5">
   <circle cx="50" cy="50" r="14"/><circle cx="50" cy="50" r="27"/><circle cx="50" cy="50" r="40"/>
  </g>
  <path d="M50 50 L50 6 A44 44 0 0 1 88 30 Z" fill="url(#sw)"/>
  <circle cx="50" cy="50" r="4.5" fill="#fff"/>
  <circle cx="68" cy="34" r="4" fill="#26E0E0"/><circle cx="68" cy="34" r="8" fill="none" stroke="#26E0E0" stroke-width="1.4" opacity=".5"/>
 </svg></div>
 <div class="lbl">2 · Radar blip</div>
</div>

<!-- 3: Great-circle arc + node -->
<div class="cell">
 <div class="ic"><svg width="200" height="200" viewBox="0 0 100 100">
  <defs>
   <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1730"/><stop offset="1" stop-color="#050c18"/></linearGradient>
   <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4F8DFF"/><stop offset="1" stop-color="#26E0E0"/></linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg3)"/>
  <g stroke="#2a3c5c" stroke-width="1" opacity=".5">
   <line x1="0" y1="33" x2="100" y2="33"/><line x1="0" y1="66" x2="100" y2="66"/><line x1="33" y1="0" x2="33" y2="100"/><line x1="66" y1="0" x2="66" y2="100"/>
  </g>
  <path d="M16 80 Q40 18 84 30" fill="none" stroke="url(#arc)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="1.5 6"/>
  <circle cx="16" cy="80" r="4.5" fill="#4F8DFF"/>
  <g transform="translate(84,30) rotate(35) scale(.34)">
   <path fill="#fff" d="M50 4 L56 18 L56 40 L95 64 L95 72 L56 56 L56 80 L70 90 L70 95 L50 88 L30 95 L30 90 L44 80 L44 56 L5 72 L5 64 L44 40 L44 18 Z"/>
  </g>
 </svg></div>
 <div class="lbl">3 · Flight path</div>
</div>

<!-- 4: A monogram as arc -->
<div class="cell">
 <div class="ic"><svg width="200" height="200" viewBox="0 0 100 100">
  <defs>
   <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10254a"/><stop offset="1" stop-color="#07101f"/></linearGradient>
   <linearGradient id="g4" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4F8DFF"/><stop offset="1" stop-color="#26E0E0"/></linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg4)"/>
  <!-- A: two legs + arc crossbar -->
  <g fill="none" stroke="url(#g4)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
   <path d="M30 76 L50 26 L70 76"/>
   <path d="M36 60 Q50 52 64 60"/>
  </g>
  <circle cx="50" cy="26" r="4.5" fill="#fff"/>
 </svg></div>
 <div class="lbl">4 · A monogram</div>
</div>

</body>
