services:
  atlas-db:
    image: postgis/postgis:16-3.4
    container_name: atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

  atlas-redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    command: redis-server --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - atlas-network

  atlas-minio:
    # MinIO removed its Docker Hub repo (minio/minio now 404s on pull); quay.io
    # is the publisher's own registry and carries the identical release tags.
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: atlas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_LICENSE_KEY: ${MINIO_LICENSE_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - atlas-network

  atlas-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8010:8000"
    depends_on:
      atlas-db:
        condition: service_healthy
      atlas-redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - atlas-network

  atlas-frontend:
    image: node:20-alpine
    container_name: atlas-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file: .env
    ports:
      - "3010:3000"
    depends_on:
      - atlas-backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - atlas-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: atlas-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - atlas-backend
      - atlas-minio
    networks:
      - atlas-network

  # Local ADS-B receiver. Requires an RTL-SDR dongle physically attached to the
  # host; it decodes 1090MHz itself and serves aircraft.json. Opt-in so the
  # stack still comes up on hosts with no SDR:
  #     docker compose --profile sdr up -d atlas-dump1090
  # Find the device first with `lsusb` (RTL-SDR shows as RTL2838/RTL2832U), and
  # blacklist the kernel DVB driver or it will claim the dongle:
  #     echo 'blacklist dvb_usb_rtl28xxu' | sudo tee /etc/modprobe.d/no-rtl.conf
  atlas-dump1090:
    image: ghcr.io/sdr-enthusiasts/docker-dump1090-fa:latest
    container_name: atlas-dump1090
    profiles: ["sdr"]
    restart: unless-stopped
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    environment:
      TZ: ${TZ:-UTC}
      READSB_DEVICE_TYPE: rtlsdr
      READSB_GAIN: ${SDR_GAIN:-autogain}
      READSB_LAT: ${SDR_LAT}
      READSB_LON: ${SDR_LON}
      READSB_RX_LOCATION_ACCURACY: "2"
      READSB_STATS_RANGE: "true"
    ports:
      - "8078:8080"
    tmpfs:
      - /run:exec,size=64M
      - /var/log
    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
