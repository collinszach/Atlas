name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs in a disposable KVM VM on the gs65 (hq deploy/gs65/ci), destroyed afterwards,
# with no route to the home network or tailnet. Agent pull requests are included.
jobs:
  backend:
    name: Backend tests
    runs-on: [self-hosted, gs65-vm]
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: atlas_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["127.0.0.1:6379:6379"]
    env:
      # Same disposable values tests/conftest.py defaults to.
      DATABASE_URL: postgresql+asyncpg://atlas:testpass@localhost:5432/atlas_test
      DATABASE_URL_SYNC: postgresql+psycopg2://atlas:testpass@localhost:5432/atlas_test
      REDIS_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      # Integration tests (marked) are deselected by pytest.ini.
      - run: pytest -q

  ios:
    name: iOS tests
    # GitHub-hosted, not the gs65 fleet: that runner is Linux, and there is exactly
    # one of it. macOS minutes are free for public repositories.
    #
    # macos-26, not macos-15: ClerkKit's Package.swift declares swift-tools 6.2.0,
    # which the Xcode on macos-15 cannot parse — it fails resolution with
    # "'clerk-ios' >= 1.2.0 contains incompatible tools version (6.2.0)" before any
    # code is compiled. macos-latest still points at the older image, so pin it.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iOS
    steps:
      - uses: actions/checkout@v4
      # The .xcodeproj is gitignored and generated, so this must run before build.
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      # Printed so a future tools-version bump fails with an obvious cause rather
      # than an opaque dependency-resolution error.
      - name: Toolchain
        run: xcodebuild -version && swift --version
      # Pick whatever iPhone simulator the runner image actually has, rather than
      # pinning a name that silently disappears when the image is bumped.
      - name: Test
        run: |
          SIM=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['name'] for r in d.values() for x in r if x['name'].startswith('iPhone')))")
          echo "Using simulator: $SIM"
          xcodebuild test \
            -project Atlas.xcodeproj -scheme Atlas \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  frontend:
    name: Frontend checks
    runs-on: [self-hosted, gs65-vm]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

      # Hallmark's Floor: contrast, focus, reduced motion, invented facts, broken
      # phone layout. DESIGN.md is the locked system and records the waived
      # reflexes; see tools/README.md for why sloplint is vendored.
      #
      # Gate 20 is excluded. It requires a Hallmark build stamp on line 1 of every
      # CSS file, carrying that build's picks and critique. globals.css was written
      # by hand, so a stamp there would assert a build that never happened.
      - name: Design Floor (sloplint)
        working-directory: .
        run: |
          node tools/sloplint.mjs frontend/src --scope app --genre atmospheric --json \
            > /tmp/sloplint.json
          python3 - <<'EOF'
          import json, sys
          findings = json.load(open('/tmp/sloplint.json'))['findings']
          floor = [f for f in findings if f['grade'] == 'FAIL' and str(f['gate']) != '20']
          for f in floor:
              print(f"FAIL gate {f['gate']} {f['file']}:{f['line']} {f['evidence']}")
          print(f"{len(floor)} Floor violation(s)")
          sys.exit(1 if floor else 0)
          EOF
