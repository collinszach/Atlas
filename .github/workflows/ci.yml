name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs in a disposable KVM VM on the gs65 (hq deploy/gs65/ci), destroyed afterwards,
# with no route to the home network or tailnet. Agent pull requests are included.
jobs:
  backend:
    name: Backend tests
    runs-on: [self-hosted, gs65-vm]
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: atlas_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["127.0.0.1:6379:6379"]
    env:
      # Same disposable values tests/conftest.py defaults to.
      DATABASE_URL: postgresql+asyncpg://atlas:testpass@localhost:5432/atlas_test
      DATABASE_URL_SYNC: postgresql+psycopg2://atlas:testpass@localhost:5432/atlas_test
      REDIS_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      # Integration tests (marked) are deselected by pytest.ini.
      - run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: [self-hosted, gs65-vm]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
